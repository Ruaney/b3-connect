services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: b3-integration-atlas:latest
    container_name: b3-atlas-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
