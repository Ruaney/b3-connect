name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages e na branch gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

# Garante apenas um deploy simultâneo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Sincronizar catálogo para publicação
        run: |
          mkdir -p docs/catalog
          cp -f catalog/*.json docs/catalog/

      - name: Configurar GitHub Pages (Actions runtime)
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato Pages (diretório docs/)
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Publicar no GitHub Pages (Actions)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Publicar na branch gh-pages (Fallback automático garantido)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
          force_orphan: true
