name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy simultâneo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Sincronizar catálogo para publicação
        run: |
          mkdir -p docs/catalog
          cp -f catalog/*.json docs/catalog/

      - name: Fazer upload do artefato Pages (diretório docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
